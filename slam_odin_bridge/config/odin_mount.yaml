odin_localization_bridge:
  ros__parameters:
    # Pose of the Odin sensor frame relative to the robot center/base frame.
    # x: forward from robot center, y: left, z: up, yaw: CCW around z.
    # The default yaw pi represents an Odin mounted facing backward.
    mount_base_to_odin_x: -0.35
    mount_base_to_odin_y: 0.0
    mount_base_to_odin_z: 0.0
    mount_base_to_odin_yaw: 3.141592653589793

    # Optional rotation applied to the published runtime coordinate frame.
    # Keep 0.0 when move_to targets are written in the same odom/map frame that
    # Odin publishes. Set pi only if the whole Odin odom frame must be flipped.
    runtime_frame_yaw: 0.0
